# ====================== 向量库（Chroma）配置 ======================
collection_name: agent

# 持久化目录：相对工程根目录，代码内部会转换为绝对路径，
# 保证从任意工作目录启动都读写同一份向量库
persist_directory: rag/chroma_db

# 向量检索 TopK
k: 3

# ====================== 文本分块参数 ======================
chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", "。", "！", "？", "；", "，", " ", ""]

# ====================== 知识库源文件配置 ======================
# 知识库源文件目录（支持批量导入）
data_path: data
# MD5 增量更新记录文件
md5_hex_store: md5.txt
# 允许入库的文件类型
allow_knowledge_file_type: [".txt", ".pdf"]